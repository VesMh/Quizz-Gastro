 heading(active?active.name:'Quiz general','');
 view.innerHTML=`<div class="panel"><div class="cards">${['Antrenament','Examen'].map((name,i)=>`<button class="mode" aria-pressed="false" onclick="selectMode(${i===0})">${icon(i===0?'book':'clock')}<strong>${name}</strong></button>`).join('')}</div>

function selectMode(training){
 learning=training;
 view.querySelectorAll('.mode').forEach((btn,i)=>btn.setAttribute('aria-pressed',String((i===0)===training)));

function shuffle(items){
 for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
 return items
}
let sessionPdfIds=[];
let attemptRows, mixQuestions, mixOptions, durationMs;
function start(){
 
 const get=id=>document.getElementById(id);
 mixQuestions=get('mixQ').checked;
 mixOptions=get('mixA').checked;
 durationMs=Number(get('duration').value)*60000;
 attemptRows=active?active.rows:bank;
 if(!active){
  const pool=bank.slice();
  if(mixQuestions)shuffle(pool);
  attemptRows=pool.slice(0,Number(get('count').value))
 }
 retryQuiz()
}
function retryQuiz(){
 clearInterval(timer);
 questions=attemptRows.slice();
 if(mixQuestions)shuffle(questions);
 sessionPdfIds=orderedSets.includes(active)?questions.map(row=>documentIds[active.offset+active.rows.indexOf(row)]):[];
 if(mixOptions)questions=questions.map(([q,opts,key])=>{
  const order=shuffle(opts.map((_,i)=>i));
  return [q,order.map(i=>opts[i]),order.map((original,i)=>key.includes(original)?i:-1).filter(i=>i>=0)]
 });
 answers=questions.map(()=>[]);locked=questions.map(()=>false);pos=0;
 if(!learning){end=Date.now()+durationMs;timer=setInterval(tick,300)}
 draw()
}
function optionMark(question,option){
 if(questions[question][2].includes(option))return {style:answers[question].includes(option)?'mark-right':'mark-missed',label:'✓ Corect'};
 if(answers[question].includes(option))return {style:'mark-wrong',label:'✗ Greșit'};
 return null
}
function verdict(mark,selected){
 const right=mark.style!=='mark-wrong';
 const label=right?(selected?'Corect':'Corect · omis'):'Greșit';
 return '<span class="verdict"><span class="status-icon">'+icon(right?'right':'wrong')+'</span>'+label+'</span>'
}
function learningControls(){
 const choices=view.querySelectorAll('.choice');
 choices.forEach((button,i)=>{
  button.disabled=locked[pos];
  const mark=locked[pos]&&optionMark(pos,i);

 });
 const nav=view.querySelector('nav');nav.innerHTML='<button '+(!pos?'disabled':'')+' onclick="pos--;draw()">← Înapoi</button>'+(!locked[pos]?'<button class="action" '+(!answers[pos].length?'disabled':'')+' onclick="verifyAnswer()">Verifică</button>':'')+(pos+1<questions.length?'<button onclick="pos++;draw()">'+(locked[pos]?'Înainte →':'Sari peste →')+'</button>':'<button onclick="submitExam()">Încheie quizul</button>');

function calculateGrade(score){
 if(learning)return Math.round((1+9*score/questions.length)*10)/10;

 const percent=Math.round((Math.round(points*100)/100)/questions.length*10000)/100;
 return ([[90,10],[80,9],[70,8],[65,7],[60,6],[50,5],[40,4],[30,3],[15,2]].find(([limit])=>percent>limit)||[0,1])[1]
}

function pick(i){if(learning&&locked[pos])return;const a=answers[pos];answers[pos]=a.includes(i)?a.filter(x=>x!==i):questions[pos][2].length===1?[i]:[...a,i];draw('');view.querySelectorAll('.choice')[i].focus({preventScroll:true})}
function submitExam(){
 const missing=answers.filter(a=>!a.length).length;
 if(!missing){finish();return}
 heading(learning?'Închei quizul?':'Închei examenul?',active?active.name:'Gastroenterologie');

 if(!learning)tick();

}
function correct(i){const a=answers[i],k=questions[i][2];return a.length===k.length&&k.every(x=>a.includes(x))}
function finish(){clearInterval(timer);const score=questions.filter((_,i)=>correct(i)).length;const grade=calculateGrade(score);saveGrade(grade);heading(learning?'Rezultatul quizului':'Rezultatul examenului','Gastroenterologie');view.innerHTML='<div class="panel"><h2 class="text-2xl font-bold">Nota '+grade.toLocaleString('ro',{maximumFractionDigits:2})+'</h2><p class="mt-2">'+score+' răspunsuri complet corecte din '+questions.length+'.</p><nav><button class="action" onclick="retryQuiz()">Refă quizul</button><button onclick="modes()">Alege modul</button></nav></div>'+questions.map(([q,o,k],i)=>'<details class="panel"><summary>'+ (i+1)+'. '+(correct(i)?'✓ Corect':'✗ '+(answers[i].length?'Greșit':'Fără răspuns'))+' · '+escapeText(q)+'</summary>'+o.map((opt,j)=>{

 return '<p class="review '+(mark?mark.style:'')+'">'+'<span class="answer-copy">'+(mark?verdict(mark,answers[i].includes(j)):'')+String.fromCharCode(65+j)+'. '+escapeText(opt)+(answers[i].includes(j)?' <strong>(ales)</strong>':'')+'</span></p>'
 }).join('')+'</details>').join('');window.scrollTo(0,0)}
